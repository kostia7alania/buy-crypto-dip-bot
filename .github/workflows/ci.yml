name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  postgres18-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES18_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo build --filter=@buy-crypto-dip-bot/api...
      - run: pnpm --filter @buy-crypto-dip-bot/db test:postgres18
      - run: pnpm --filter @buy-crypto-dip-bot/api test:postgres18
  production-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build production image locally
        run: docker build --tag dipbot:release-candidate .
      - name: Check packaged migrator without network or secrets
        run: |
          docker run --rm --network none \
            -e APP_RUNTIME=non-local \
            -e POSTGRES_CONNECTION_STRING=postgresql://postgres:fixture@db:5432/dipbot \
            -e POSTGRES_RUNTIME_PASSWORD=0123456789abcdef0123456789abcdef0123456789abcdef \
            --entrypoint node dipbot:release-candidate packages/db/scripts/migrate.mjs --check-config
