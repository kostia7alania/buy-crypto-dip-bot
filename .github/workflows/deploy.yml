name: Deploy

# CI builds the image. The small VPS only backs up PostgreSQL, pulls the
# immutable image digest, runs migrations, and restarts the services.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES18_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @buy-crypto-dip-bot/db test:postgres18
      - run: pnpm build
      - run: pnpm --filter @buy-crypto-dip-bot/api test:postgres18

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Manual runs from feature branches may build an image, but never deploy it.
    if: ${{ vars.DEPLOY_ENABLED == 'true' && vars.GATE1_APPROVED == 'true' && github.ref == 'refs/heads/main' }}
    env:
      TARGET_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Require independently verified SSH identity
        env:
          VPS_SSH_FINGERPRINT: ${{ vars.VPS_SSH_FINGERPRINT }}
        run: test -n "$VPS_SSH_FINGERPRINT"
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ vars.VPS_SSH_FINGERPRINT }}
          envs: TARGET_IMAGE,TARGET_SHA
          script: |
            set -Eeuo pipefail
            umask 077
            RELEASE_SCRIPT="$(mktemp)"
            trap 'rm -f "$RELEASE_SCRIPT"' EXIT
            curl --fail --silent --show-error --location --retry 3 \
              "https://raw.githubusercontent.com/kostia7alania/buy-crypto-dip-bot/$TARGET_SHA/scripts/deploy-release.sh" \
              --output "$RELEASE_SCRIPT"
            bash "$RELEASE_SCRIPT"
