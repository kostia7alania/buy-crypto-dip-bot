name: Deploy

# CI builds the image. The small VPS only backs up PostgreSQL, pulls the
# immutable image digest, runs migrations, and restarts the services.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Manual runs from feature branches may build an image, but never deploy it.
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
      TARGET_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_REPOSITORY,TARGET_IMAGE,TARGET_SHA
          script: |
            set -Eeuo pipefail
            umask 077

            APP_DIR=/opt/buy-crypto-dip-bot
            DEPLOY_DIR="$APP_DIR/.deploy"
            BACKUP_DIR="$APP_DIR/backups"
            NEXT_COMPOSE="$DEPLOY_DIR/docker-compose.$TARGET_SHA.next.yml"
            PREVIOUS_COMPOSE="$DEPLOY_DIR/docker-compose.previous.yml"
            PREVIOUS_IMAGE_FILE="$DEPLOY_DIR/image.previous"

            cd "$APP_DIR"
            mkdir -p "$DEPLOY_DIR" "$BACKUP_DIR"
            test -s .env
            test -s docker-compose.yml

            set_image() {
              local image="$1"
              awk -v image="$image" '
                BEGIN { replaced = 0 }
                /^DIPBOT_IMAGE=/ {
                  if (!replaced) print "DIPBOT_IMAGE=" image
                  replaced = 1
                  next
                }
                { print }
                END { if (!replaced) print "DIPBOT_IMAGE=" image }
              ' .env > .env.next
              chmod 600 .env.next
              mv .env.next .env
            }

            rollback() {
              local status=$?
              trap - ERR
              echo "Deploy failed; restoring the previous compose and image."
              if test -s "$PREVIOUS_COMPOSE" && test -s "$PREVIOUS_IMAGE_FILE"; then
                cp "$PREVIOUS_COMPOSE" docker-compose.yml
                set_image "$(cat "$PREVIOUS_IMAGE_FILE")"
                docker compose config --quiet || true
                docker compose up -d --wait --wait-timeout 180 || true
              else
                echo "No previous release metadata exists; manual recovery is required."
              fi
              exit "$status"
            }

            curl --fail --silent --show-error --location --retry 3 \
              "https://raw.githubusercontent.com/${{ github.repository }}/$TARGET_SHA/docker-compose.prod.yml" \
              --output "$NEXT_COMPOSE"
            DIPBOT_IMAGE="$TARGET_IMAGE" docker compose \
              --env-file "$APP_DIR/.env" \
              --project-directory "$APP_DIR" \
              -f "$NEXT_COMPOSE" config --quiet
            docker pull "$TARGET_IMAGE"

            CURRENT_CONTAINER="$(docker compose ps -q api 2>/dev/null || true)"
            CURRENT_IMAGE=""
            if test -n "$CURRENT_CONTAINER"; then
              CURRENT_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$CURRENT_CONTAINER" 2>/dev/null || true)"
            fi
            if test -z "$CURRENT_IMAGE"; then
              CURRENT_IMAGE="$(sed -n 's/^DIPBOT_IMAGE=//p' .env | tail -n 1)"
            fi
            if test -z "$CURRENT_IMAGE"; then
              CURRENT_IMAGE="$IMAGE_REPOSITORY:latest"
            fi

            cp docker-compose.yml "$PREVIOUS_COMPOSE"
            printf '%s\n' "$CURRENT_IMAGE" > "$PREVIOUS_IMAGE_FILE"

            if docker compose ps --services --status running | grep -qx db; then
              BACKUP_TMP="$BACKUP_DIR/dipbot-$TARGET_SHA.dump.tmp"
              BACKUP_FILE="$BACKUP_DIR/dipbot-$TARGET_SHA.dump"
              docker compose exec -T db pg_dump -U postgres -d dipbot -Fc > "$BACKUP_TMP"
              test -s "$BACKUP_TMP"
              docker compose exec -T db pg_restore --list < "$BACKUP_TMP" > /dev/null
              mv "$BACKUP_TMP" "$BACKUP_FILE"
            fi

            trap rollback ERR
            mv "$NEXT_COMPOSE" docker-compose.yml
            set_image "$TARGET_IMAGE"
            docker compose config --quiet
            docker compose up -d --wait --wait-timeout 180

            curl --fail --silent --show-error --retry 6 --retry-all-errors \
              http://127.0.0.1:8787/health > /dev/null
            docker compose exec -T web node -e \
              "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"

            REDIRECT_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header 'Host: buy-crypto-dip-bot.com' http://127.0.0.1/)"
            case "$REDIRECT_STATUS" in
              301|302|307|308) ;;
              *) echo "HTTP redirect check failed with $REDIRECT_STATUS"; false ;;
            esac

            trap - ERR
            printf '%s\n' "$TARGET_IMAGE" > "$DEPLOY_DIR/image.last-successful"
            cp docker-compose.yml "$DEPLOY_DIR/docker-compose.last-successful.yml"
            docker compose ps
