name: Inspect VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      INSPECT_SHA: ${{ github.sha }}
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: INSPECT_SHA
          script: |
            set -Eeuo pipefail
            umask 077
            [[ "$INSPECT_SHA" =~ ^[0-9a-f]{40}$ ]]
            INSPECT_SCRIPT="$(mktemp)"
            trap 'rm -f "$INSPECT_SCRIPT"' EXIT
            curl --fail --silent --show-error --location --retry 3 \
              "https://raw.githubusercontent.com/kostia7alania/buy-crypto-dip-bot/$INSPECT_SHA/scripts/inspect-vps.sh" \
              --output "$INSPECT_SCRIPT"
            bash "$INSPECT_SCRIPT"
